<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webhook Echo Spy | Real-Time Inspector</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur py-4 px-6 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-lg font-bold text-lg">⚡</div>
            <h1 class="text-xl font-bold tracking-tight">Webhook Echo Spy</h1>
        </div>
        <div id="session-controls" class="hidden flex items-center space-x-3">
            <span class="text-xs text-slate-400">Endpoint URL:</span>
            <code id="endpoint-url" class="bg-slate-900 border border-slate-700 px-3 py-1 rounded text-sm text-indigo-400 select-all"></code>
            <button onclick="copyEndpoint()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1 rounded text-xs transition">Copy</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        <!-- Setup View -->
        <div id="setup-view" class="lg:col-span-3 text-center py-20">
            <h2 class="text-3xl font-extrabold mb-4">Inspect & Debug Webhooks in Real-Time</h2>
            <p class="text-slate-400 max-w-xl mx-auto mb-8">Generate a secure temporary endpoint instantly to capture incoming HTTP webhooks, inspect headers, and analyze JSON payloads.</p>
            <button onclick="createSession()" class="bg-indigo-600 hover:bg-indigo-500 font-semibold px-6 py-3 rounded-xl shadow-lg transition">Create Inspector Session</button>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="lg:col-span-3 hidden grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 h-[70vh] flex flex-col">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="font-semibold text-sm text-slate-400 uppercase tracking-wider">Captured Requests (<span id="req-count">0</span>)</h3>
                    <button onclick="clearRequests()" class="text-xs text-rose-400 hover:underline">Clear</button>
                </div>
                <div id="requests-list" class="space-y-2 overflow-y-auto flex-1 pr-1"></div>
            </div>

            <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-6 h-[70vh] flex flex-col">
                <h3 class="font-semibold text-sm text-slate-400 uppercase tracking-wider mb-4">Request Inspector</h3>
                <div id="inspector-content" class="flex-1 overflow-y-auto text-sm text-slate-300">
                    <div class="flex items-center justify-center h-full text-slate-500">Select a captured request to inspect headers and body</div>
                </div>
            </div>
        </div>
    </main>
    <script src="app.js"></script>
</body>
</html>
